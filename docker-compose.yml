services:
  lxgate:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: lxgate_app
    # hostname: yourhostname <- optional

    # ---------------------------------------------------------------- LxGate
    # LxGate embeds a VPNGate exit engine: a Python sidecar that brings up an
    # OpenVPN tunnel on tun0 and exposes a loopback SOCKS5/HTTP proxy that Xray
    # can route through. That needs two host capabilities and the tun device:
    #   NET_ADMIN  create/configure tun0 and the policy routes
    #   NET_RAW    ip6tables for the same rules on IPv6
    #   /dev/net/tun  the tunnel interface itself
    # Without them the panel runs normally and the VPNGate page reports the
    # engine as unavailable, so this stays safe on hosts without tun.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    # Optional hard memory cap. When set, the panel derives its Go soft limit
    # (GOMEMLIMIT, ~90% of this cap) so it GCs before the OOM killer fires.
    # mem_limit: 512m
    volumes:
      # Panel database and settings.
      - $PWD/db/:/etc/lxgate/
      # VPNGate engine state: node cache, tunnel configs, structured logs. Keep
      # it on a volume so a recreate does not force a fresh node discovery.
      - $PWD/vpngate_data/:/opt/lxgate/vpngate_data/
      - $PWD/cert/:/root/cert/
      # Persists acme.sh state so certificate auto-renewal survives container
      # recreation (the entrypoint re-registers the renewal cron job from it).
      - $PWD/acme/:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      # System & Update answers with "docker compose pull && docker compose up -d"
      # instead of claiming it can self-update inside a container.
      LXGATE_DOCKER: "1"
      # VPNGate engine. The internal API is loopback-only and the SOCKS5 proxy is
      # loopback-only, so neither needs publishing: Xray reaches the proxy from
      # inside this container.
      LXGATE_VPNGATE_ENABLED: "1"
      LXGATE_VPNGATE_API_PORT: "18787"
      LOCAL_PROXY_PORT: "7928"
      # Memory tuning. The panel keeps RAM low via GOGC + periodic release; it no
      # longer sets a soft limit from total host RAM (no benefit, risks GC thrash).
      # XUI_GOGC: "75"              # lower = less RAM, slightly more CPU; GOGC env overrides
      # XUI_MEMORY_RELEASE_INTERVAL: "10"  # minutes between FreeOSMemory; 0 disables
      # Go memory soft limit, only applied from an explicit budget below (or a
      # real cgroup/mem_limit cap). Pin it with one of:
      # XUI_MEMORY_LIMIT: "400"      # in MiB
      # GOMEMLIMIT: "400MiB"         # Go syntax, takes precedence
      # XUI_PPROF: "true"           # expose pprof on 127.0.0.1:6060 for profiling
      # XUI_INIT_WEB_BASE_PATH: "/"
      # XUI_PORT: "8080"
      # To use PostgreSQL instead of the default SQLite, run:
      #   docker compose --profile postgres up -d
      # and uncomment the two lines below.
      # XUI_DB_TYPE: "postgres"
      # XUI_DB_DSN: "postgres://xui:xui@postgres:5432/xui?sslmode=disable"
    tty: true
    ports:
      # Panel UI/API. When XUI_PORT is set, publish the same container port
      # (for example "8080:8080").
      - "2053:2053"
      # Note: the VPNGate proxy (7928) and the engine API (18787) are loopback
      # only ON PURPOSE and must not be published — see README "Security".
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lxgate_postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
      - $PWD/pgdata/:/var/lib/postgresql/data
    restart: unless-stopped
